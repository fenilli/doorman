info:
  name: Register
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "test@example.com",
        "password": "secret_password"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
